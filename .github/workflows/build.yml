name: Build MJNexus Switch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/bin:/bin
      CC: aarch64-none-elf-gcc
      CXX: aarch64-none-elf-g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up auto-generated icon files
        run: |
          rm -f data/icon_AmericanEnglish.jpg data/icon_*.jpg icon.jpg icon_*.jpg *.nacp

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          mkdir -p data build dist lib

      - name: Build MuPDF
        run: |
          echo "=== Building MuPDF ==="
          make -f Makefile.mupdf -j$(nproc) 2>&1 | tee /tmp/mupdf.log
          if [ ! -f lib/libmupdf.a ]; then
            echo "❌ libmupdf.a FAILED"
            grep -iE "error:|undefined|fatal" /tmp/mupdf.log | head -20
            exit 1
          fi
          ls -la lib/libmupdf.a
          echo "✅ libmupdf.a built"

      - name: Build Borealis (CMake)
        shell: bash
        run: |
          set -o pipefail
          echo "=== CC=$CC ==="
          which $CC && which $CXX
          cd borealis/moonlight_wiliwili
          mkdir -p build_switch && cd build_switch
          echo "=== CMake ==="
          cmake .. \
            -DPLATFORM_SWITCH=ON \
            -DUSE_DEKO3D=ON \
            -DUSE_LIBROMFS=OFF \
            -DBRLS_UNITY_BUILD=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee /tmp/borealis_cmake.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ CMake FAILED"
            tail -40 /tmp/borealis_cmake.log
            exit 1
          fi
          echo ""
          echo "=== make ==="
          make -j$(nproc) borealis 2>&1 | tee /tmp/borealis_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ make FAILED"
            tail -40 /tmp/borealis_build.log
            exit 1
          fi
          echo ""
          echo "=== Copy all .a ==="
          BRLS_A=$(find . -name "libborealis.a" | head -1)
          echo "Found: $BRLS_A"
          cp "$BRLS_A" ../../../lib/
          find . -name "*.a" ! -name "libborealis.a" -exec cp {} ../../../lib/ \;
          echo "=== lib/*.a ==="
          ls -la ../../../lib/*.a
          echo "✅ Borealis done"

      - name: Build main project
        run: |
          echo "=== Make ==="
          make -j$(nproc) 2>&1 | tee /tmp/main.log
          if ls *.nro 1>/dev/null 2>&1 || ls build/*.nro 1>/dev/null 2>&1; then
            echo "✅ NRO built!"
            ls -la *.nro build/*.nro 2>/dev/null
          else
            echo "❌ NRO NOT FOUND"
            grep -iE "error:|undefined reference|fatal|No rule|missing separator" /tmp/main.log | head -30
            tail -80 /tmp/main.log
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            *.nro
            build/*.nro
            *.nacp
            build/*.nacp
            romfs/**
          if-no-files-found: ignore
