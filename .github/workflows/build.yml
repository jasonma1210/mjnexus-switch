name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Switch portlibs
        run: |
          dkp-pacman -Sy 2>&1 | tail -3 || true
          dkp-pacman -S --noconfirm switch-zlib switch-libjpeg-turbo switch-freetype switch-libpng switch-bzip2 switch-lz4 2>&1 | tail -5
          echo "zlib.h: $(find $DEVKITPRO -name zlib.h 2>/dev/null | head -1)"

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          # MuPDF 1.16.1 with submodules (thirdparty libs are submodules)
          git clone --depth 1 --recurse-submodules -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf
          echo "=== thirdparty contents ==="
          ls mupdf/thirdparty/
          echo ""
          echo "=== jbig2dec ==="
          ls mupdf/thirdparty/jbig2dec/ | head -10
          echo ""
          echo "=== zlib ==="
          ls mupdf/thirdparty/zlib/ 2>/dev/null | head -10 || echo "no bundled zlib (use portlibs)"

      - name: Build project
        run: |
          make -j$(nproc) 2>&1 | tail -100
          ls -la build/*.nro 2>/dev/null && echo "=== NRO built! ===" || echo "NRO not found"

      - name: Build NSP
        if: always()
        run: |
          if [ -f build/mjnexus_switch.nro ]; then
            bash scripts/build_nsp.sh --nro build/mjnexus_switch.nro --output dist --title-id 0x0100000000001000
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
