name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Switch portlibs
        run: |
          echo "=== 查找可用的 zlib/jpeg/freetype 等库 ==="
          dkp-pacman -Ss zlib 2>/dev/null | head -5
          echo ""
          dkp-pacman -Ss freetype 2>/dev/null | head -5
          echo ""
          dkp-pacman -Sy 2>&1 | tail -5 || true
          echo "=== 安装 switch 端口库 ==="
          dkp-pacman -S --noconfirm switch-zlib switch-libjpeg-turbo switch-freetype switch-libpng switch-bzip2 2>&1 | tail -10
          echo ""
          echo "=== 验证 zlib.h 位置 ==="
          find $DEVKITPRO -name "zlib.h" 2>/dev/null
          echo ""
          echo "=== MuPDF thirdparty/zlib ==="
          ls -la mupdf/thirdparty/zlib/zlib.h 2>/dev/null || echo "MuPDF bundled zlib.h 不存在！"
          echo ""
          echo "=== 检查 switch_rules ==="
          cat $DEVKITPRO/libnx/switch_rules | grep PORTLIBS || true

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf

      - name: Build project
        run: |
          make -j$(nproc) 2>&1 | tail -80
          ls -la build/*.nro 2>/dev/null && echo "=== NRO built! ===" || echo "NRO not found"

      - name: Build NSP
        if: always()
        run: |
          if [ -f build/mjnexus_switch.nro ]; then
            bash scripts/build_nsp.sh --nro build/mjnexus_switch.nro --output dist --title-id 0x0100000000001000
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
