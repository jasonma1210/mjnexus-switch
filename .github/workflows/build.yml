name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      # devkitPro mirror (默认 pkg.devkitpro.org 有时 403)
      DKP_PACMAN_MIRROR: "https://pkg.devkitpro.org"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Switch portlibs
        run: |
          # 先尝试设置 mirror，pacman 403 是 keyring/服务器问题
          echo "=== 尝试设置 mirror ==="
          sed -i "s|Server = https://pkg.devkitpro.org|Server = ${DKP_PACMAN_MIRROR}|g" /opt/devkitpro/pacman.conf 2>/dev/null || true
          cat /opt/devkitpro/pacman.conf 2>/dev/null | grep -i server || true
          echo ""
          # 直接装，容器内自带缓存可能有我们需要的
          # 如果 403 就跳过 -Sy（容器镜像应该已经有一些包）
          dkp-pacman -S --noconfirm switch-zlib switch-libjpeg-turbo switch-freetype switch-libpng switch-bzip2 switch-lz4 switch-harfbuzz 2>&1 | tail -15
          echo ""
          echo "=== Include check ==="
          for h in zlib.h ft2build.h hb.h jpeglib.h png.h bzlib.h lz4.h; do
            echo "  $h: $(find $DEVKITPRO -name $h 2>/dev/null | head -1 || echo 'NOT FOUND')"
          done

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf
          mkdir -p data build dist

      - name: Build project
        run: |
          # 先编 MuPDF
          echo "=== Building MuPDF ==="
          make -f Makefile.mupdf -j$(nproc) 2>&1 | tee /tmp/mupdf.log | tail -20
          echo ""
          echo "=== MuPDF result ==="
          ls -la lib/libmupdf.a 2>/dev/null && echo "✅ libmupdf.a built" || echo "❌ libmupdf.a FAILED"
          grep -iE "error:|undefined reference|fatal" /tmp/mupdf.log | head -20
          
          if [ ! -f lib/libmupdf.a ]; then exit 1; fi
          
          # 再编主工程
          echo ""
          echo "=== Building main project ==="
          make -j$(nproc) 2>&1 | tee /tmp/main.log
          echo ""
          echo "=== Main result ==="
          ls -la *.nro build/*.nro 2>/dev/null
          grep -iE "error:|undefined reference|fatal" /tmp/main.log | head -20

      - name: Build NSP
        if: always()
        run: |
          NRO=$(ls *.nro 2>/dev/null || ls build/*.nro 2>/dev/null || echo "")
          echo "NRO: $NRO"
          if [ -n "$NRO" ]; then
            bash scripts/build_nsp.sh --nro "$NRO" --output dist --title-id 0x0100000000001000
            ls -la dist/
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            *.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
