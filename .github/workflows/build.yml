name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone deps
        run: |
          echo "=== Borealis ==="
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          echo "=== MuPDF 1.16.1 ==="
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf

      - name: Build MuPDF (native)
        run: |
          echo "=== MuPDF thirdparty 目录 ==="
          ls mupdf/thirdparty/
          echo ""
          echo "=== 检查 MuPDF Makefile 支持的变量 ==="
          grep -E "^[A-Z_]+[?:]?=" mupdf/Makefile | head -20
          echo ""
          echo "=== 尝试原生构建 MuPDF ==="
          cd mupdf
          # 设置交叉编译环境变量
          export CC=aarch64-none-elf-gcc
          export CXX=aarch64-none-elf-g++
          export AR=aarch64-none-elf-ar
          export RANLIB=aarch64-none-elf-ranlib
          export STRIP=aarch64-none-elf-strip
          export LD=aarch64-none-elf-ld
          export DEFINES="-D__SWITCH__ -DFZ_ENABLE_ICC=0 -DFZ_ENABLE_JS=0 -DHAVE_PTHREAD=0 -DFZ_NO_STDIO=0 -DOPJ_STATIC"
          export CFLAGS="-march=armv8-a+crc -mtune=cortex-a57 -mtp=soft -fPIC -O2 -ffunction-sections -Wno-error -std=gnu11 $DEFINES -I$DEVKITPRO/libnx/include"
          export LDFLAGS="-march=armv8-a+crc -mtune=cortex-a57 -mtp=soft -fPIC -O2 -Wl,--gc-sections"
          make -j$(nproc) build=release HAVE_TESSERA=no HAVE_GLFW=no NOX11=yes NOGLCALLS=yes 2>&1 | tail -30 || echo "Build failed, checking errors..."
          ls build/release/libmupdf*.a 2>/dev/null && echo "MuPDF built!" || echo "MuPDF not built"
          ls build/release/thirdparty/ 2>/dev/null | head -10

      - name: Build MJNexus
        run: |
          # 把 MuPDF 产物复制到 lib/
          mkdir -p lib
          if ls mupdf/build/release/libmupdf*.a 1>/dev/null 2>&1; then
            cp mupdf/build/release/libmupdf*.a lib/
            # 也复制 thirdparty 静态库
            find mupdf/build/release/thirdparty -name "*.a" -exec cp {} lib/ \; 2>/dev/null || true
          fi
          ls -la lib/
          echo ""
          echo "=== 编译主工程 ==="
          make -j$(nproc) 2>&1 | tail -50
          ls -la build/*.nro 2>/dev/null && echo "=== NRO built! ===" || echo "NRO not found"

      - name: Build NSP
        if: always()
        run: |
          if [ -f build/mjnexus_switch.nro ]; then
            bash scripts/build_nsp.sh --nro build/mjnexus_switch.nro --output dist --title-id 0x0100000000001000
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
