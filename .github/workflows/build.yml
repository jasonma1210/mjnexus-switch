name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/bin:/bin
      CC: aarch64-none-elf-gcc
      CXX: aarch64-none-elf-g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up auto-generated icon files
        run: |
          rm -f data/icon_AmericanEnglish.jpg data/icon_*.jpg icon.jpg icon_*.jpg *.nacp

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf
          mkdir -p data build dist lib

      - name: Build MuPDF
        run: |
          echo "=== Building MuPDF ==="
          make -f Makefile.mupdf -j$(nproc) 2>&1 | tee /tmp/mupdf.log
          if [ ! -f lib/libmupdf.a ]; then
            echo "❌ libmupdf.a FAILED"
            grep -iE "error:|undefined|fatal" /tmp/mupdf.log | head -20
            exit 1
          fi
          ls -la lib/libmupdf.a
          echo "✅ libmupdf.a built"

      - name: Build Borealis (CMake)
        shell: bash
        run: |
          set -o pipefail
          echo "=== CC=$CC ==="
          echo "=== CXX=$CXX ==="
          which $CC && which $CXX
          echo ""
          cd borealis/moonlight_wiliwili
          mkdir -p build_switch && cd build_switch
          echo "=== Running CMake ==="
          cmake .. \
            -DPLATFORM_SWITCH=ON \
            -DUSE_DEKO3D=ON \
            -DUSE_LIBROMFS=OFF \
            -DBRLS_UNITY_BUILD=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee /tmp/borealis_cmake.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ CMake configure FAILED"
            tail -60 /tmp/borealis_cmake.log
            exit 1
          fi
          echo ""
          echo "=== make borealis ==="
          make -j$(nproc) borealis 2>&1 | tee /tmp/borealis_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ make borealis FAILED"
            tail -80 /tmp/borealis_build.log
            exit 1
          fi
          echo ""
          echo "=== Borealis result ==="
          BRLS_A=$(find . -name "libborealis.a" 2>/dev/null | head -1)
            echo "Found BRLS_A: $BRLS_A"
            if [ -n "$BRLS_A" ] && [ -f "$BRLS_A" ]; then
              cp "$BRLS_A" ../../../lib/
              # 复制所有其他 .a（fmt/yoga/tinyxml2/tweeny 等）
              find . -name "*.a" ! -name "libborealis.a" -exec cp {} ../../../lib/ \;
              echo "=== lib/ 目录所有 .a ==="
              ls -la ../../../lib/*.a
              echo "✅ All static libs copied"
            else
              echo "❌ libborealis.a NOT FOUND after build"
              exit 1
            fi

      - name: Build main project
        run: |
          echo "=== Building main project ==="
          echo "=== Checking borealis.hpp ==="
          find borealis/moonlight_wiliwili -name "borealis.hpp" 2>/dev/null
          echo "=== Checking Makefile INCLUDE ==="
          grep "INCLUDES\|INCLUDE " Makefile
          echo "=== Full compile flags test ==="
          aarch64-none-elf-g++ -v -Iborealis/moonlight_wiliwili/library/include -c source/main.cpp -o /dev/null 2>&1 | tail -5
          echo ""
          make -j$(nproc) 2>&1 | tee /tmp/main.log
          if ls *.nro 1>/dev/null 2>&1 || ls build/*.nro 1>/dev/null 2>&1; then
            echo "✅ NRO built!"
            ls -la *.nro build/*.nro 2>/dev/null
          else
            echo "❌ NRO NOT FOUND"
            grep -iE "error:|undefined reference|fatal|No rule|missing separator" /tmp/main.log | head -50
            echo ""
            echo "=== Full log tail ==="
            tail -100 /tmp/main.log
            exit 1
          fi

      - name: Build NSP
        run: |
          NRO=$(ls *.nro 2>/dev/null || ls build/*.nro 2>/dev/null || echo "")
          echo "NRO: $NRO"
          if [ -n "$NRO" ]; then
            bash scripts/build_nsp.sh --nro "$NRO" --output dist --title-id 0x0100000000001000
            ls -la dist/
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            *.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
