name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone deps
        run: |
          echo "=== Borealis ==="
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          echo "=== MuPDF 1.16.1 ==="
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf || \
            (curl -sL https://mupdf.com/downloads/archive/mupdf-1.16.1-source.tar.xz -o mupdf.tar.xz && \
             tar xf mupdf.tar.xz && mv mupdf-1.16.1-source mupdf && rm mupdf.tar.xz)

      - name: Build MuPDF
        run: |
          cd mupdf
          ls Makefile
          make -j$(nproc) build=release HAVE_TESSERA=no HAVE_GLFW=no NOX11=yes NOGLCALLS=yes CROSS=aarch64-none-elf- XCFLAGS="-D__SWITCH__ -I$DEVKITPRO/libnx/include" 2>&1 | tail -30 || echo "MuPDF build failed, trying simpler approach"

      - name: Build MJNexus
        run: |
          if [ -f mupdf/build/release/libmupdf.a ]; then mkdir -p lib && cp mupdf/build/release/libmupdf.a lib/; fi
          make -j$(nproc) 2>&1 | tail -50
          ls -la build/*.nro 2>/dev/null && echo "=== NRO built successfully! ===" || echo "NRO not found - check errors above"

      - name: Build NSP
        if: always()
        run: |
          if [ -f build/mjnexus_switch.nro ]; then
            bash scripts/build_nsp.sh --nro build/mjnexus_switch.nro --output dist --title-id 0x0100000000001000
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
