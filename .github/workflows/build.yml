name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Switch portlibs
        run: |
          # pacman db 403 暂时跳过 -Sy，直接 -S（容器内自带缓存）
          dkp-pacman -S --noconfirm switch-zlib switch-libjpeg-turbo switch-freetype switch-libpng switch-bzip2 switch-lz4 switch-harfbuzz 2>&1 | tail -10
          echo "=== Include check ==="
          for h in zlib.h ft2build.h hb.h jpeglib.h png.h bzlib.h lz4.h; do
            echo "  $h: $(find $DEVKITPRO -name $h 2>/dev/null | head -1 || echo 'NOT FOUND')"
          done

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf

      - name: Build project
        run: |
          make -j$(nproc) 2>&1 | tee /tmp/build.log | tail -150
          echo ""
          echo "=== Build result ==="
          if ls build/*.nro 1>/dev/null 2>&1; then
            ls -la build/*.nro
            echo "=== NRO built successfully! ==="
          else
            echo "NRO NOT FOUND"
            echo ""
            echo "=== Last 30 error lines ==="
            grep -iE "error:|undefined reference|fatal" /tmp/build.log | tail -30
            exit 1
          fi

      - name: Build NSP
        if: always()
        run: |
          if [ -f build/mjnexus_switch.nro ]; then
            bash scripts/build_nsp.sh --nro build/mjnexus_switch.nro --output dist --title-id 0x0100000000001000
            ls -la dist/
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
