name: Build MJNexus Switch

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/bin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify toolchain
        run: |
          echo "=== DEVKITPRO=$DEVKITPRO ==="
          ls -la $DEVKITPRO/ 2>/dev/null | head -10
          echo ""
          echo "=== GCC check ==="
          which aarch64-none-elf-gcc || echo "gcc not in PATH"
          aarch64-none-elf-gcc --version 2>&1 | head -2
          echo ""
          echo "=== Portlibs dir ==="
          ls $DEVKITPRO/portlibs/switch/include/freetype2/ft2build.h 2>/dev/null && echo "freetype OK" || echo "freetype MISSING"
          ls $DEVKITPRO/portlibs/switch/include/harfbuzz/hb.h 2>/dev/null && echo "harfbuzz OK" || echo "harfbuzz MISSING"
          ls $DEVKITPRO/portlibs/switch/include/zlib.h 2>/dev/null && echo "zlib OK" || echo "zlib MISSING"

      - name: Clone deps
        run: |
          git clone --depth 1 -b moonlight_wiliwili https://github.com/XITRIX/borealis.git borealis/moonlight_wiliwili
          git clone --depth 1 -b 1.16.1 https://github.com/ArtifexSoftware/mupdf.git mupdf
          mkdir -p data build dist

      - name: Dump file structure
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== data/ ==="
          ls -la data/ 2>/dev/null
          echo ""
          echo "=== resources/icons/ ==="
          ls -la resources/icons/ 2>/dev/null
          echo ""
          echo "=== Any icon_* files? ==="
          find . -name 'icon_*' -o -name '*American*' 2>/dev/null
          echo ""
          echo "=== BINFILES test ==="
          DATA := data
          for f in $(ls data/*.* 2>/dev/null); do echo "  bin: $f"; done
          echo ""
          echo "=== switch_rules check ==="
          grep -n "icon_American\|MULTI_ICON\|icon_" $DEVKITPRO/libnx/switch_rules 2>/dev/null | head -20
          echo ""
          echo "=== NACP files ==="
          ls *.nacp 2>/dev/null
      - name: Build MuPDF
        run: |
          export DEVKITPRO=$DEVKITPRO
          export PATH=$PATH
          echo "=== Building MuPDF ==="
          make -f Makefile.mupdf -j$(nproc) 2>&1 | tee /tmp/mupdf.log
          echo ""
          echo "=== MuPDF result ==="
          if [ -f lib/libmupdf.a ]; then
            ls -la lib/libmupdf.a
            echo "✅ libmupdf.a built"
          else
            echo "❌ libmupdf.a FAILED"
            echo ""
            echo "=== Errors ==="
            grep -iE "error:|undefined reference|fatal|Error" /tmp/mupdf.log | head -20
            exit 1
          fi

      - name: Build main project
        run: |
          export DEVKITPRO=$DEVKITPRO
          export PATH=$PATH
          echo "=== Building main project ==="
          make -j$(nproc) 2>&1 | tee /tmp/main.log
          echo ""
          if ls *.nro 1>/dev/null 2>&1 || ls build/*.nro 1>/dev/null 2>&1; then
            echo "✅ NRO built!"
            ls -la *.nro build/*.nro 2>/dev/null
          else
            echo "❌ NRO NOT FOUND"
            echo ""
            echo "=== Errors ==="
            grep -iE "error:|undefined reference|fatal|No rule|missing separator" /tmp/main.log | head -30
            exit 1
          fi

      - name: Build NSP
        run: |
          NRO=$(ls *.nro 2>/dev/null || ls build/*.nro 2>/dev/null || echo "")
          echo "NRO: $NRO"
          if [ -n "$NRO" ]; then
            bash scripts/build_nsp.sh --nro "$NRO" --output dist --title-id 0x0100000000001000
            echo "=== NSP contents ==="
            ls -la dist/
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mjnexus-switch-build
          path: |
            build/*.nro
            *.nro
            dist/*.nsp
            dist/*.nacp
            dist/*.npdm
          if-no-files-found: ignore
